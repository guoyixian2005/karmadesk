<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KarmaDesk — 轩窗雨霁 · 案头茶席</title>
  <meta name="description" content="一堂古韵，对开推窗观山雨。堂上清雅金匾，案头陈列颂钵、紫晶、溪石、木檐悬铃。三维纵深推窗，细雨斜织于窗外，声波激荡，愿随声应。">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            zen: {
              gold: '#f0ce7d',
              goldLight: '#fff2cb',
              crystal: '#d8bcfc',
              stone: '#a8c2d8',
              chime: '#f7e3aa',
              jade: '#5eb895'
            }
          },
          animation: {
            'bell-sway': 'bellSway 4.2s ease-in-out infinite',
            'float-affirm': 'floatAffirm 2.2s cubic-bezier(0.2, 0.85, 0.25, 1) forwards',
            'mist-drift-1': 'mistDrift 32s ease-in-out infinite alternate',
            'mist-drift-2': 'mistDrift 45s ease-in-out infinite alternate-reverse'
          },
          keyframes: {
            bellSway: {
              '0%, 100%': { transform: 'rotate(0deg)' },
              '25%': { transform: 'rotate(2.6deg)' },
              '75%': { transform: 'rotate(-2.6deg)' }
            },
            floatAffirm: {
              '0%': { opacity: '0', transform: 'translate(-50%, 20px) scale(0.7)' },
              '15%': { opacity: '1', transform: 'translate(-50%, -20px) scale(1.06)' },
              '75%': { opacity: '0.9', transform: 'translate(-50%, -100px) scale(1)' },
              '100%': { opacity: '0', transform: 'translate(-50%, -150px) scale(0.92)' }
            },
            mistDrift: {
              '0%': { transform: 'translateX(-3%) translateY(0)' },
              '100%': { transform: 'translateX(4%) translateY(-6px)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
    body {
      font-family: 'Noto Serif SC', serif;
      user-select: none;
      -webkit-user-select: none;
      background-color: #060403;
    }
    .mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* 液态玻璃拟物风格 */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(28px) saturate(190%);
      -webkit-backdrop-filter: blur(28px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 
        0 14px 36px 0 rgba(0, 0, 0, 0.55),
        inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 1px 0 rgba(0, 0, 0, 0.3);
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .liquid-glass:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 0 18px 46px 0 rgba(0, 0, 0, 0.65);
      transform: translateY(-2px);
    }
    .liquid-glass:active {
      transform: scale(0.96) translateY(1px);
    }

    /* 传统文人书斋小雅匾（精巧典雅，比例严格契合古建大梁） */
    .antique-plaque {
      background: linear-gradient(135deg, #1b0e07 0%, #110703 100%);
      border: 2px solid #5a3014;
      box-shadow: 
        0 6px 16px rgba(0, 0, 0, 0.8),
        inset 0 0 10px rgba(0, 0, 0, 0.9),
        inset 0 1px 1px rgba(240, 206, 125, 0.4);
      transition: all 0.3s ease;
    }

    /* -------------------------------------------------------------
       【核心优化 1】：真实向外推开的 3D 雕花实木推窗 (3D Pushed-Open Shutters)
       ------------------------------------------------------------- */
    .shutter-left-3d {
      transform: perspective(900px) rotateY(52deg);
      transform-origin: left center;
      box-shadow: 14px 0 35px rgba(0, 0, 0, 0.85);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .shutter-right-3d {
      transform: perspective(900px) rotateY(-52deg);
      transform-origin: right center;
      box-shadow: -14px 0 35px rgba(0, 0, 0, 0.85);
      transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.3, 1);
    }

    /* 真实红木长案深邃漆光纹理 */
    .mahogany-surface {
      background: 
        linear-gradient(to bottom, rgba(68, 24, 13, 0.96) 0%, rgba(32, 10, 5, 0.98) 45%, rgba(14, 4, 2, 1) 100%),
        repeating-linear-gradient(2deg, transparent, transparent 16px, rgba(0,0,0,0.25) 18px, transparent 22px);
    }

    /* 物件触碰手感 */
    .zen-item {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.3s ease;
    }
    .zen-item:hover {
      transform: translateY(-6px) scale(1.02);
    }
    .zen-item:active {
      transform: translateY(2px) scale(0.96) !important;
    }

    /* 闲置自动淡化 UI */
    .ui-fader {
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    body.zen-focus-mode .ui-fader {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    body.user-idle:not(.zen-focus-mode) .ui-fader {
      opacity: 0.22;
    }
    body.user-idle:not(.zen-focus-mode) .ui-fader:hover {
      opacity: 1;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between overflow-hidden relative text-gray-100">

  <!-- =========================================================================
       1. 具有真实空气纵深感的多层轩窗空间系统 (3D Depth Window & Room)
       ========================================================================= -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden bg-[#0a0705]">

    <!-- -----------------------------------------------------------------------
         【景深轩窗框架】：带 3D 倒角内窗套、深度遮蔽与向外推开的窗扉
         ----------------------------------------------------------------------- -->
    <div id="windowFrameContainer" class="absolute top-14 left-8 right-8 bottom-60 md:top-18 md:left-24 md:right-24 md:bottom-72 rounded-t-xl overflow-hidden border-[12px] md:border-[18px] border-[#221008] shadow-[inset_0_0_70px_rgba(0,0,0,0.92)]">
      
      <!-- 四周窗套 3D 内折角投影与环境光遮蔽 -->
      <div class="absolute inset-0 shadow-[inset_0_24px_50px_rgba(0,0,0,0.8),inset_24px_0_40px_rgba(0,0,0,0.7),inset_-24px_0_40px_rgba(0,0,0,0.7)] z-20 pointer-events-none"></div>

      <!-- =====================================================================
           【窗外自然视差景深空间】：极远苍山、动态云雾、中景湖泊绿林、近景竹叶
           ===================================================================== -->
      <div id="depthWorld" class="absolute inset-0 w-full h-full overflow-hidden transition-transform duration-200 ease-out">
        
        <!-- 景深第 1 层（极远景 · 苍山含黛与天色） -->
        <div id="layerFarMountains" class="absolute -inset-4 bg-cover bg-center filter brightness-[0.72] contrast-[1.05] transition-transform duration-300" style="background-image: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=2600&auto=format&fit=crop');">
          <div class="absolute inset-0 bg-gradient-to-b from-[#1c2e2a]/60 via-[#142320]/40 to-[#0e1816]/80"></div>
        </div>

        <!-- 景深第 2 层（山谷流动的真实动态烟岚水雾 · Dynamic Valley Mist） -->
        <div class="absolute inset-0 opacity-40 animate-mist-drift-1 pointer-events-none z-2">
          <div class="w-full h-full bg-gradient-to-t from-transparent via-[#a8c9bf]/20 to-transparent blur-2xl"></div>
        </div>

        <!-- 景深第 3 层（中景山麓与纯净碧水，彻底去除任何人工斑马条纹！） -->
        <div id="layerMidLake" class="absolute bottom-0 left-0 right-0 h-2/3 transition-transform duration-200 z-3 pointer-events-none">
          <!-- 纯净的大自然湖泊深水色与山脚深林，绝无任何奇怪线条 -->
          <div class="w-full h-full bg-gradient-to-t from-[#10241f]/95 via-[#16332c]/50 to-transparent"></div>
        </div>

        <!-- 景深第 4 层（低空林间水汽流雾） -->
        <div class="absolute bottom-10 left-0 right-0 h-40 opacity-45 animate-mist-drift-2 pointer-events-none z-4">
          <div class="w-full h-full bg-gradient-to-t from-[#1b3630]/70 via-[#274d44]/30 to-transparent blur-xl"></div>
        </div>

        <!-- 景深第 5 层（近景窗外青竹枝叶，近大远小对比） -->
        <div id="layerNearBamboo" class="absolute -bottom-4 left-6 w-72 h-80 z-6 transition-transform duration-150 pointer-events-none drop-shadow-[0_15px_20px_rgba(0,0,0,0.8)] opacity-90 hidden sm:block">
          <svg class="w-full h-full" viewBox="0 0 280 320" fill="none">
            <path d="M40,320 Q55,180 75,60" stroke="#0a1613" stroke-width="8" stroke-linecap="round"/>
            <path d="M70,320 Q95,190 120,80" stroke="#0e1d19" stroke-width="7" stroke-linecap="round"/>
            <path d="M75,60 Q110,75 145,70 Q115,85 75,60 Z" fill="#132a24"/>
            <path d="M73,63 Q125,50 160,35 Q120,60 73,63 Z" fill="#1b3b33"/>
            <path d="M120,80 Q165,95 205,90 Q160,110 120,80 Z" fill="#152f28"/>
            <path d="M118,83 Q175,70 215,55 Q165,85 118,83 Z" fill="#20453c"/>
            <path d="M60,140 Q105,155 150,150 Q110,170 60,140 Z" fill="#122620"/>
            <path d="M98,160 Q145,175 190,170 Q145,190 98,160 Z" fill="#193730"/>
            <circle cx="158" cy="36" r="2" fill="#d2ede5" opacity="0.6"/>
            <circle cx="203" cy="91" r="2.5" fill="#d2ede5" opacity="0.7"/>
          </svg>
        </div>

        <!-- 窗外琉璃微雾空气层 -->
        <div class="absolute inset-0 bg-white/[0.015] backdrop-blur-[0.2px] z-7 pointer-events-none"></div>

        <!-- 景深雨丝画布：STRICTLY 限制在窗户外景内部！带有远中近三层视差，绝无半空平地水花！ -->
        <canvas id="rainCanvas" class="absolute inset-0 w-full h-full pointer-events-none z-8"></canvas>

      </div>

      <!-- =====================================================================
           【核心优化 1】：真实向外推开的 3D 雕花对开木窗 (3D Open Wooden Lattice Shutters)
           彻底替换掉之前呆板的平面棕色长方形色块，展现由内向外的透视进深！
           ===================================================================== -->
      <!-- 左推窗扇（以左框为轴，朝外打开，呈 3D 侧向透视） -->
      <div class="shutter-left-3d absolute top-0 bottom-0 left-0 w-24 md:w-36 bg-[#2a1309] border-r-4 border-[#4d2314] shadow-2xl flex flex-col justify-around py-6 px-2 z-25 pointer-events-none">
        <div class="w-full h-24 border-2 border-[#5a2c1a] rounded flex items-center justify-center bg-[#1c0a04]/40">
          <div class="w-3/5 h-3/5 border border-[#5a2c1a]/60 flex items-center justify-center">
            <div class="w-2 h-2 rotate-45 border border-[#5a2c1a]/60"></div>
          </div>
        </div>
        <div class="w-full h-32 border-2 border-[#5a2c1a] rounded flex items-center justify-center bg-[#1c0a04]/40">
          <div class="w-3/5 h-3/5 border border-[#5a2c1a]/60 flex items-center justify-center">
            <div class="w-2 h-2 rotate-45 border border-[#5a2c1a]/60"></div>
          </div>
        </div>
        <div class="w-full h-24 border-2 border-[#5a2c1a] rounded flex items-center justify-center bg-[#1c0a04]/40">
          <div class="w-3/5 h-3/5 border border-[#5a2c1a]/60 flex items-center justify-center">
            <div class="w-2 h-2 rotate-45 border border-[#5a2c1a]/60"></div>
          </div>
        </div>
        <!-- 侧边厚度与高光边线 -->
        <div class="absolute top-0 bottom-0 right-0 w-1 bg-[#6b331f]/70"></div>
      </div>

      <!-- 右推窗扇（以右框为轴，朝外打开，呈 3D 侧向透视） -->
      <div class="shutter-right-3d absolute top-0 bottom-0 right-0 w-24 md:w-36 bg-[#2a1309] border-l-4 border-[#4d2314] shadow-2xl flex flex-col justify-around py-6 px-2 z-25 pointer-events-none">
        <div class="w-full h-24 border-2 border-[#5a2c1a] rounded flex items-center justify-center bg-[#1c0a04]/40">
          <div class="w-3/5 h-3/5 border border-[#5a2c1a]/60 flex items-center justify-center">
            <div class="w-2 h-2 rotate-45 border border-[#5a2c1a]/60"></div>
          </div>
        </div>
        <div class="w-full h-32 border-2 border-[#5a2c1a] rounded flex items-center justify-center bg-[#1c0a04]/40">
          <div class="w-3/5 h-3/5 border border-[#5a2c1a]/60 flex items-center justify-center">
            <div class="w-2 h-2 rotate-45 border border-[#5a2c1a]/60"></div>
          </div>
        </div>
        <div class="w-full h-24 border-2 border-[#5a2c1a] rounded flex items-center justify-center bg-[#1c0a04]/40">
          <div class="w-3/5 h-3/5 border border-[#5a2c1a]/60 flex items-center justify-center">
            <div class="w-2 h-2 rotate-45 border border-[#5a2c1a]/60"></div>
          </div>
        </div>
        <!-- 侧边厚度与高光边线 -->
        <div class="absolute top-0 bottom-0 left-0 w-1 bg-[#6b331f]/70"></div>
      </div>

      <!-- 窗台外青石坎 -->
      <div class="absolute bottom-0 left-0 right-0 h-6 bg-[#161a18] border-t-2 border-[#242b29] shadow-inner z-20"></div>
    </div>

    <!-- 室内实木大梁 -->
    <div class="absolute top-0 left-0 right-0 h-16 md:h-20 bg-gradient-to-b from-[#130502] via-[#200b05] to-[#180804] border-b-4 border-[#3d170c] shadow-[0_15px_45px_rgba(0,0,0,0.9)] z-20 flex items-center justify-between px-12">
      <div class="absolute bottom-0 left-0 right-0 h-1 bg-[#562212]/50"></div>
    </div>

    <!-- 左右室内实木立柱 -->
    <div class="absolute top-0 bottom-60 md:bottom-72 left-0 w-8 md:w-24 bg-gradient-to-r from-[#100402] to-[#180703] z-20 border-r-2 border-[#301108]"></div>
    <div class="absolute top-0 bottom-60 md:bottom-72 right-0 w-8 md:w-24 bg-gradient-to-l from-[#100402] to-[#180703] z-20 border-l-2 border-[#301108]"></div>

    <!-- 前景红木长案茶台 -->
    <div class="absolute bottom-0 left-0 right-0 h-60 md:h-72 z-20 mahogany-surface border-t-[6px] border-[#612516] shadow-[0_-30px_90px_rgba(0,0,0,0.95)]">
      <div class="absolute inset-0 bg-gradient-to-b from-white/10 via-white/[0.015] to-black/70 pointer-events-none"></div>
      <div class="absolute top-3 left-10 right-10 h-52 border border-[#612516]/40 rounded pointer-events-none"></div>
    </div>

  </div>

  <!-- =========================================================================
       2. 顶部中央：文人书斋小雅匾（小巧克制、比例真实、契合古建大梁）
       ========================================================================= -->
  <div class="ui-fader w-full flex justify-center pt-2.5 md:pt-3.5 z-30 relative pointer-events-none">
    <div class="pointer-events-auto flex items-center justify-center">
      
      <div class="relative flex flex-col items-center">
        <!-- 大梁下精细黄铜挂环 -->
        <div class="flex items-center gap-20 -mb-1">
          <div class="w-1.5 h-2 rounded-t-sm bg-[#522919] border border-zen-gold/60"></div>
          <div class="w-1.5 h-2 rounded-t-sm bg-[#522919] border border-zen-gold/60"></div>
        </div>

        <!-- 小巧精致文人雅匾 -->
        <div id="zenPlaqueEl" class="antique-plaque rounded-sm px-6 md:px-8 py-1.5 md:py-2 flex items-center justify-center cursor-pointer shadow-xl border-[#683917]" title="点击快速修改匾额祈愿词">
          <div class="border border-zen-gold/35 px-4 md:px-5 py-0.5 rounded-[1px] flex items-center gap-2">
            <span class="text-zen-gold/45 text-[8px] select-none">❖</span>
            <span id="plaqueTextDisplay" class="text-sm md:text-base font-semibold tracking-[0.25em] text-zen-gold drop-shadow-[0_1px_6px_rgba(240,206,125,0.5)] font-serif">
              心想事成
            </span>
            <span class="text-zen-gold/45 text-[8px] select-none">❖</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- 顶部状态栏浮动按钮（液态玻璃） -->
  <header class="ui-fader w-full max-w-5xl mx-auto px-6 -mt-8 md:-mt-10 flex items-center justify-between z-30 relative pointer-events-none">
    <div class="flex items-center gap-2 pointer-events-auto">
      <div class="w-7 h-7 rounded-xl liquid-glass flex items-center justify-center text-zen-gold text-xs shadow-md">
        ☯
      </div>
      <div>
        <h1 class="text-xs font-semibold tracking-wider text-white">KarmaDesk</h1>
        <p class="text-[10px] text-gray-400">对开推窗 · 纵深雨境</p>
      </div>
    </div>

    <div class="flex items-center gap-2.5 pointer-events-auto">
      <!-- 心流计数 -->
      <div class="flex items-center gap-1.5 px-3 py-1 rounded-full liquid-glass text-xs">
        <span class="text-gray-300">善念:</span>
        <span id="counterNum" class="mono-num font-semibold text-zen-gold tracking-wider text-xs">0</span>
      </div>

      <!-- 听雨观澜 -->
      <button id="rainToggleBtn" class="liquid-glass flex items-center gap-1.5 px-3.5 py-1 rounded-full text-xs text-gray-200 cursor-pointer" title="开关窗外大自然细雨（2.5秒渐变）">
        <svg id="rainIcon" class="w-3.5 h-3.5 text-zen-jade" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"/>
          <path d="M8 19v2M8 13v2M12 21v2M12 15v2M16 19v2M16 13v2"/>
        </svg>
        <span id="rainBtnText" class="font-medium">听雨观澜</span>
        <span id="fadeBadge" class="text-[9px] px-1 py-0.2 rounded bg-zen-jade/20 text-zen-jade hidden">渐变中</span>
      </button>

      <!-- 纯净观雨屏保 (F 键) -->
      <button id="focusModeBtn" class="liquid-glass p-2 rounded-full text-gray-300 hover:text-white transition-all text-xs" title="纯净观雨屏保（按 F）">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
      </button>

      <!-- 防窥时钟 (Esc) -->
      <button id="stealthBtn" class="liquid-glass p-2 rounded-full text-gray-300 hover:text-white transition-all text-xs" title="极简时钟 (Esc)">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- =========================================================================
       3. 核心交互舞台：风铃系于大梁，三法器实打实坐在红木桌面上
       ========================================================================= -->
  <main class="relative flex-1 flex flex-col justify-end items-center px-4 z-25">
    
    <!-- 愿望显化升华粒子层 -->
    <div id="particleZone" class="absolute inset-0 pointer-events-none flex items-center justify-center overflow-hidden"></div>

    <!-- 木檐风铃：系于大梁铁钩上 -->
    <div class="absolute top-12 md:top-14 right-14 md:right-32 z-30 flex flex-col items-center">
      <div class="w-2.5 h-3 bg-[#2b170c] border border-[#522919] rounded-t-sm shadow-md"></div>
      <div class="w-2 h-2 rounded-full border border-zen-chime/70 -mt-1 bg-[#1a0e08]"></div>
      
      <button id="btnChime" class="zen-item relative group flex flex-col items-center outline-none focus:outline-none cursor-pointer" title="轻触风铃或按 [4]：清风拂铃 (Focus +1)">
        <div class="w-[1.2px] h-12 bg-gradient-to-b from-[#875527] via-zen-chime to-zen-chime"></div>
        
        <div class="animate-bell-sway origin-top flex flex-col items-center drop-shadow-[0_12px_24px_rgba(247,227,170,0.4)]">
          <svg class="w-11 h-13" viewBox="0 0 48 56" fill="none">
            <defs>
              <linearGradient id="chimeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#fff8e7"/>
                <stop offset="50%" stop-color="#e2bc6a"/>
                <stop offset="100%" stop-color="#7a5518"/>
              </linearGradient>
            </defs>
            <circle cx="24" cy="5" r="4" stroke="#f0dca2" stroke-width="1.8" fill="none"/>
            <path d="M14 16 C 14 10, 34 10, 34 16 C 35 30, 42 42, 42 45 C 42 48, 6 48, 6 45 C 6 42, 13 30, 14 16 Z" fill="url(#chimeGrad)"/>
            <ellipse cx="24" cy="46" rx="18" ry="4" fill="#42290d"/>
            <ellipse cx="24" cy="45" rx="18" ry="3.5" stroke="#fff1d0" stroke-width="1.2" fill="none"/>

  <!-- =========================================================================
       4. Web Audio API、立体视差与无水花深远雨景引擎
       ========================================================================= -->
  <script>
    // -------------------------------------------------------------
    // (1) Web Audio API 声学引擎
    // -------------------------------------------------------------
    let audioCtx = null;
    let rainSource = null;
    let rainGain = null;
    let isRaining = false;
    let isFading = false;

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 432Hz 铜磬颂钵 (Tibetan Singing Bowl)
    function playSingingBowl() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const harmonics = [
        { freq: 432, gain: 0.65, decay: 5.5 },
        { freq: 864, gain: 0.28, decay: 4.2 },
        { freq: 1296, gain: 0.14, decay: 2.8 },
        { freq: 2160, gain: 0.05, decay: 1.8 }
      ];

      harmonics.forEach(h => {
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(h.freq + (Math.random() - 0.5) * 1.2, now);
        
        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.exponentialRampToValueAtTime(h.gain, now + 0.02);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + h.decay);

        osc.connect(gainNode);
        gainNode.connect(ctx.destination);

        osc.start(now);
        osc.stop(now + h.decay + 0.1);
      });
    }

    // 紫黄晶石簇 (Crystal Chime - 温润纯正五音阶)
    function playCrystalChime() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const notes = [1046.5, 1318.5, 1567.98, 1975.5];

      notes.forEach((freq, idx) => {
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2200, now);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.025);

        const initGain = 0.22 / (idx + 1);
        gainNode.gain.setValueAtTime(0.0001, now);
        gainNode.gain.exponentialRampToValueAtTime(initGain, now + idx * 0.025 + 0.015);
        gainNode.gain.exponentialRampToValueAtTime(0.0001, now + 2.5 + idx * 0.2);

        osc.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(ctx.destination);

        osc.start(now + idx * 0.025);
        osc.stop(now + 3.0);
      });
    }

    // 雨润青溪石 (River Stone - 天然岩石与水面轻叩低频)
    function playRiverStone() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(115, now);
      osc.frequency.exponentialRampToValueAtTime(45, now + 0.15);

      gain.gain.setValueAtTime(0.55, now);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);

      const bufferSize = ctx.sampleRate * 0.04;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.25));
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;
      const noiseFilter = ctx.createBiquadFilter();
      noiseFilter.type = 'bandpass';
      noiseFilter.frequency.setValueAtTime(650, now);

      const noiseGain = ctx.createGain();
      noiseGain.gain.setValueAtTime(0.18, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

      noise.connect(noiseFilter);
      noiseFilter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(now);
    }

    // 窗檐古铜风铃 (Wind Chime - 双管清风回响)
    function playWindChime() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      const chimes = [1567.98, 2093.0];

      chimes.forEach((f, idx) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();

        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(f, now);
        filter.Q.setValueAtTime(8, now);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(f + (Math.random() - 0.5) * 2, now + idx * 0.04);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.25, now + idx * 0.04 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.2 + idx * 0.3);

        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);

        osc.start(now + idx * 0.04);
        osc.stop(now + 3.8);
      });
    }

    // 自然雨声 2.5 秒平滑渐入与渐出
    const fadeBadge = document.getElementById('fadeBadge');

    function startRainWithFadeIn() {
      const ctx = getAudioContext();
      isFading = true;
      fadeBadge.classList.remove('hidden');

      const bufferSize = ctx.sampleRate * 4;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + white * 0.085;
        b1 = 0.96300 * b1 + white * 0.25;
        b2 = 0.57000 * b2 + white * 0.9;
        data[i] = (b0 + b1 + b2) * 0.038;
      }

      rainSource = ctx.createBufferSource();
      rainSource.buffer = buffer;
      rainSource.loop = true;

      rainGain = ctx.createGain();
      const now = ctx.currentTime;
      rainGain.gain.setValueAtTime(0.0001, now);
      rainGain.gain.exponentialRampToValueAtTime(0.18, now + 2.5);

      rainSource.connect(rainGain);
      rainGain.connect(ctx.destination);
      rainSource.start();

      setTimeout(() => {
        isFading = false;
        fadeBadge.classList.add('hidden');
      }, 2500);
    }

    function stopRainWithFadeOut() {
      const ctx = getAudioContext();
      if (!rainGain || !rainSource) return;

      isFading = true;
      fadeBadge.classList.remove('hidden');

      const now = ctx.currentTime;
      rainGain.gain.setValueAtTime(rainGain.gain.value, now);
      rainGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);

      setTimeout(() => {
        rainSource?.stop();
        rainSource?.disconnect();
        rainSource = null;
        rainGain = null;
        isFading = false;
        fadeBadge.classList.add('hidden');
      }, 2600);
    }

    // -------------------------------------------------------------
    // (2) 鼠标微视差算法：让远山、中景、近竹产生真实空气景深
    // -------------------------------------------------------------
    const layerFar = document.getElementById('layerFarMountains');
    const layerMid = document.getElementById('layerMidLake');
    const layerBamboo = document.getElementById('layerNearBamboo');

    window.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const deltaX = (e.clientX - centerX) / centerX;
      const deltaY = (e.clientY - centerY) / centerY;

      if (layerFar) {
        layerFar.style.transform = `translate(${deltaX * -4}px, ${deltaY * -3}px) scale(1.04)`;
      }
      if (layerMid) {
        layerMid.style.transform = `translate(${deltaX * -9}px, ${deltaY * -5}px)`;
      }
      if (layerBamboo) {
        layerBamboo.style.transform = `translate(${deltaX * -18}px, ${deltaY * -10}px)`;
      }
    });

    // -------------------------------------------------------------
    // (3) 【核心优化 3】：深远无水花三维景深雨丝引擎
    // 彻底解决“下雨为什么会有落在地面的水花、应该在外面下”的问题！
    // -------------------------------------------------------------
    const canvas = document.getElementById('rainCanvas');
    const windowFrameContainer = document.getElementById('windowFrameContainer');
    const ctx2d = canvas.getContext('2d');
    let raindrops = [];
    let animId = null;

    function resizeCanvas() {
      canvas.width = windowFrameContainer.clientWidth;
      canvas.height = windowFrameContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    setTimeout(resizeCanvas, 100);

    class Raindrop {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * (canvas.width + 100) - 50;
        this.y = Math.random() * -120;
        
        // 区分远景微雨、中景山林雨、近窗雨
        this.layer = Math.random(); 
        if (this.layer < 0.45) {
          // 远景雨雾：极细、极淡、极慢、随风微飘
          this.length = Math.random() * 10 + 6;
          this.speed = Math.random() * 3 + 4;
          this.opacity = Math.random() * 0.14 + 0.06;
          this.width = 0.6;
        } else if (this.layer < 0.8) {
          // 中景山林雨：中等细密、斜掠
          this.length = Math.random() * 18 + 12;
          this.speed = Math.random() * 6 + 7;
          this.opacity = Math.random() * 0.24 + 0.12;
          this.width = 0.9;
        } else {
          // 近景细雨：较长、较快
          this.length = Math.random() * 28 + 18;
          this.speed = Math.random() * 9 + 10;
          this.opacity = Math.random() * 0.38 + 0.2;
          this.width = 1.2;
        }
      }
      update() {
        this.y += this.speed;
        this.x += 1.3; // 自然微风斜掠
        
        // 【关键改动】：雨滴穿透整个开阔外景，自然坠入底部深湖消失，绝不在半空绘制平面水花圈！
        if (this.y > canvas.height + 40) {
          this.reset();
        }
      }
      draw() {
        ctx2d.strokeStyle = `rgba(205, 235, 225, ${this.opacity})`;
        ctx2d.lineWidth = this.width;
        ctx2d.beginPath();
        ctx2d.moveTo(this.x, this.y);
        ctx2d.lineTo(this.x + 1.3, this.y + this.length);
        ctx2d.stroke();
      }
    }

    function initRain() {
      raindrops = [];
      const dropCount = Math.floor(canvas.width / 7.5);
      for (let i = 0; i < dropCount; i++) raindrops.push(new Raindrop());
    }

    function renderRain() {
      ctx2d.clearRect(0, 0, canvas.width, canvas.height);
      if (isRaining) {
        raindrops.forEach(drop => { drop.update(); drop.draw(); });
        animId = requestAnimationFrame(renderRain);
      }
    }

    const rainToggleBtn = document.getElementById('rainToggleBtn');
    const rainBtnText = document.getElementById('rainBtnText');

    rainToggleBtn.addEventListener('click', () => {
      isRaining = !isRaining;
      if (isRaining) {
        rainToggleBtn.classList.add('border-zen-jade', 'text-zen-jade');
        rainBtnText.textContent = '雨声渐止';
        startRainWithFadeIn();
        initRain();
        renderRain();
      } else {
        rainToggleBtn.classList.remove('border-zen-jade', 'text-zen-jade');
        rainBtnText.textContent = '听雨观澜';
        stopRainWithFadeOut();
      }
    });

    // -------------------------------------------------------------
    // (4) 雅匾愿望实时同步与敲击发光升华
    // -------------------------------------------------------------
    let tapTotal = parseInt(localStorage.getItem('karmadesk_v8_taps') || '0', 10);
    const counterDisplay = document.getElementById('counterNum');
    counterDisplay.textContent = tapTotal;

    const customWishInput = document.getElementById('customWishInput');
    const plaqueTextDisplay = document.getElementById('plaqueTextDisplay');
    const zenPlaqueEl = document.getElementById('zenPlaqueEl');

    function syncPlaque() {
      const val = customWishInput.value.trim() || '心想事成';
      plaqueTextDisplay.textContent = val;
    }
    customWishInput.addEventListener('input', syncPlaque);
    syncPlaque();

    zenPlaqueEl.addEventListener('click', () => {
      customWishInput.focus();
      customWishInput.select();
    });

    function triggerResonance(soundFn, defaultAffirmation, colorClass, sourceEl) {
      soundFn();

      tapTotal++;
      localStorage.setItem('karmadesk_v8_taps', tapTotal);
      counterDisplay.textContent = tapTotal;

      // 雅匾金光微颤
      zenPlaqueEl.classList.add('scale-[1.04]');
      zenPlaqueEl.style.boxShadow = '0 0 30px rgba(240,206,125,0.7), inset 0 0 18px rgba(240,206,125,0.4)';
      setTimeout(() => {
        zenPlaqueEl.classList.remove('scale-[1.04]');
        zenPlaqueEl.style.boxShadow = '';
      }, 650);

      const wishText = customWishInput.value.trim() || defaultAffirmation;

      const particleZone = document.getElementById('particleZone');
      const particle = document.createElement('div');
      particle.className = `absolute select-none pointer-events-none text-base md:text-xl font-bold tracking-widest animate-float-affirm ${colorClass} drop-shadow-[0_4px_22px_rgba(255,255,255,0.6)]`;
      particle.textContent = wishText;

      const rect = sourceEl ? sourceEl.getBoundingClientRect() : null;
      if (rect) {
        particle.style.left = `${rect.left + rect.width / 2}px`;
        particle.style.top = `${rect.top - 15}px`;
      } else {
        particle.style.left = '50%';
        particle.style.top = '65%';
      }
      particleZone.appendChild(particle);
      setTimeout(() => particle.remove(), 2200);

      if (sourceEl && sourceEl.id === 'btnBowl') {
        const water = document.getElementById('bowlWaterRipple');
        water.classList.remove('opacity-20');
        water.classList.add('opacity-95');
        setTimeout(() => {
          water.classList.remove('opacity-95');
          water.classList.add('opacity-20');
        }, 600);
      }
    }

    // 绑定 4 大物件点击事件
    const btnBowl = document.getElementById('btnBowl');
    const btnCrystal = document.getElementById('btnCrystal');
    const btnStone = document.getElementById('btnStone');
    const btnChime = document.getElementById('btnChime');

    btnBowl.addEventListener('click', () => triggerResonance(
      playSingingBowl, 'Peace +1', 'text-zen-gold', btnBowl
    ));

    btnCrystal.addEventListener('click', () => triggerResonance(
      playCrystalChime, 'Abundance +$1', 'text-zen-crystal', btnCrystal
    ));

    btnStone.addEventListener('click', () => triggerResonance(
      playRiverStone, 'Stress -1', 'text-zen-stone', btnStone
    ));

    btnChime.addEventListener('click', () => triggerResonance(
      playWindChime, 'Focus +1', 'text-zen-chime', btnChime
    ));

    // 快捷键联动：1, 2, 3, 4, Spacebar, F, Esc
    window.addEventListener('keydown', (e) => {
      if (document.activeElement === customWishInput) return;

      if (e.key === '1') {
        btnBowl.click();
      } else if (e.key === '2') {
        btnCrystal.click();
      } else if (e.key === '3') {
        btnStone.click();
      } else if (e.key === '4') {
        btnChime.click();
      } else if (e.code === 'Space') {
        e.preventDefault();
        btnBowl.click();
      } else if (e.key.toLowerCase() === 'f') {
        toggleFocusMode();
      } else if (e.code === 'Escape') {
        toggleStealth();
      }
    });

    // -------------------------------------------------------------
    // (5) 纯净观雨屏保模式 (F 键或双击空白处)
    // -------------------------------------------------------------
    function toggleFocusMode() {
      document.body.classList.toggle('zen-focus-mode');
    }
    document.getElementById('focusModeBtn').addEventListener('click', toggleFocusMode);

    document.body.addEventListener('dblclick', (e) => {
      if (e.target.closest('button') || e.target.closest('input')) return;
      toggleFocusMode();
    });

    // -------------------------------------------------------------
    // (6) 避屏老板时钟 (Esc)
    // -------------------------------------------------------------
    const stealthOverlay = document.getElementById('stealthOverlay');
    let clockTimer = null;

    function updateClock() {
      const now = new Date();
      document.getElementById('clockTime').textContent = now.toLocaleTimeString([], { hour12: false });
    }

    function toggleStealth() {
      const isHidden = stealthOverlay.classList.contains('hidden');
      if (isHidden) {
        updateClock();
        clockTimer = setInterval(updateClock, 1000);
        stealthOverlay.classList.remove('hidden');
      } else {
        clearInterval(clockTimer);
        stealthOverlay.classList.add('hidden');
      }
    }

    document.getElementById('stealthBtn').addEventListener('click', toggleStealth);
    stealthOverlay.addEventListener('click', toggleStealth);

    // -------------------------------------------------------------
    // (7) 闲置 4.5 秒自动收敛 UI 保证通透纯净
    // -------------------------------------------------------------
    let idleTimer = null;
    function resetIdle() {
      document.body.classList.remove('user-idle');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        document.body.classList.add('user-idle');
      }, 4500);
    }
    window.addEventListener('mousemove', resetIdle);
    window.addEventListener('keydown', resetIdle);
    resetIdle();
  </script>
</body>
</html>
